databases:
  - name: penaxis-hrm-db
    plan: free
    databaseName: penaxis_hrm
    user: penaxis_hrm

services:
  - type: web
    name: penaxis-hrm-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HRM_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: penaxis-hrm-db
          property: connectionString
